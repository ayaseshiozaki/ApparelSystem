<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>売上情報検索</title>

    <link rel="stylesheet"
          th:href="@{/css/03-17-uriage/09-uriage_kensaku.css}">
</head>

<body>

<div class="container">

    <h1>売上情報検索</h1>

    <!--
        検索ボタンを押すと、
        GET /sales/search?saleID=入力値
        の形式でSaleControllerへ送信する
        ※未入力の場合はブラウザが送信を止める（required）
    -->
    <form th:action="@{/sales/search}"
          method="get">

        <div class="form-grid">

            <label for="saleID">
                売上ID
            </label>

            <input id="saleID"
                   type="text"
                   name="saleID"
                   maxlength="8"
                   placeholder="例：S0000008"
                   required>

        </div>

        <!-- エラーメッセージ -->
        <p class="error"
           th:if="${errorMessage}"
           th:text="${errorMessage}">
        </p>

        <div class="button-area">

            <button type="submit"
                    class="search-btn">
                検索
            </button>

            <!-- 全件表示（キーワード不要の専用URLへ） -->
            <button type="button"
                    class="search-btn"
                    onclick="location.href='/sales/search-all'">
                全件表示
            </button>

            <button type="button"
                    class="back-btn"
                    onclick="location.href='/uriage'">
                戻る
            </button>

        </div>

    </form>

</div>

</body>

</html>
