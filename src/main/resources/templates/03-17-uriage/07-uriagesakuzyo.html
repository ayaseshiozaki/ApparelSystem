<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>売上情報削除</title>
  <link rel="stylesheet" th:href="@{/css/03-17-uriage/07-uriagesakuzyo.css}">
</head>
<body>
<div class="page-wrapper">
  <h1 class="page-title">売上情報削除</h1>

  <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>
  <p th:if="${message}" th:text="${message}" style="color:green;"></p>

  <p class="section-label">削除する売上ID</p>

  <form th:action="@{/sales/delete}" method="post">
    <div class="form-area">
      <div class="left-col">
        <div class="form-row">
          <label>売上ID</label>
          <input type="text" name="saleID" placeholder="売上IDを入力" required>
        </div>
      </div>
    </div>

    <div class="button-row">
      <button type="submit" class="btn-search">削除</button>
      <button type="button" class="btn-back"
              onclick="location.href='/uriage'">戻る</button>
    </div>
  </form>
</div>
</body>
</html>
