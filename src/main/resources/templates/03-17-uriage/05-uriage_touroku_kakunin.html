<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>売上情報登録確認</title>

    <link rel="stylesheet"
          th:href="@{/css/03-17-uriage/05-uriage_touroku_kakunin.css}">
</head>

<body>

<div class="container">

    <h1>登録確認</h1>

    <p class="error-message"
       th:if="${errorMessage}"
       th:text="${errorMessage}">
    </p>

    <p class="file-name"
       th:if="${csvFileName}">

        選択したファイル：

        <span th:text="${csvFileName}">
            sales.csv
        </span>

    </p>

    <div class="confirm-box">

        <table class="list-table">

            <thead>

            <tr>
                <th>売上ID</th>
                <th>明細ID</th>
                <th>受付ID</th>
                <th>売上日時</th>
                <th>数量</th>
                <th>購入者年代</th>
                <th>購入者性別</th>
                <th>担当者</th>
                <th>支払方法</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="sale : ${confirmSales}">

                <td th:text="${sale.saleID}"></td>

                <td th:text="${sale.lineID}"></td>

                <td th:text="${sale.acceptanceID}"></td>

                <td th:text="${#temporals.format(
                        sale.saleDateAndTime,
                        'yyyy/MM/dd HH:mm:ss')}">
                </td>

                <td th:text="${sale.quantity}"></td>

                <td th:text="${sale.buyersAgeGroup}"></td>

                <td th:text="${sale.buyersGender}"></td>

                <td th:text="${sale.contactPerson}"></td>

                <td th:text="${sale.paymentMethod}"></td>

            </tr>

            <tr th:if="${confirmSales == null
                        or #lists.isEmpty(confirmSales)}">

                <td colspan="9"
                    class="placeholder">

                    登録する売上データがありません

                </td>

            </tr>

            </tbody>

            <tfoot th:if="${confirmSales != null
                           and !#lists.isEmpty(confirmSales)}">

            <tr>

                <th colspan="8">
                    登録予定件数
                </th>

                <td th:text="${#lists.size(confirmSales) + '件'}">
                </td>

            </tr>

            </tfoot>

        </table>

    </div>

    <p class="question"
       th:if="${confirmSales != null
               and !#lists.isEmpty(confirmSales)}">

        この内容で登録しますか？

    </p>

    <div class="button-area">

        <form th:action="@{/sales/register-csv}"
              method="post"
              th:if="${confirmSales != null
                      and !#lists.isEmpty(confirmSales)}">

            <button type="submit"
                    class="btn-register">

                登録実行

            </button>

        </form>

        <form th:action="@{/sales/new}"
              method="get">

            <button type="submit"
                    class="btn-back">

                情報登録へ戻る

            </button>

        </form>

    </div>

</div>

</body>

</html>
