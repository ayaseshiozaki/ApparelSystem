<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>売上管理</title>

  <!-- CSS -->
  <link rel="stylesheet"
        th:href="@{/css/03-17-uriage/03-uriagekannri.css}">
</head>

<body>

<div class="grid-container">

  <!-- 売上情報登録 -->
  <div class="grid-card"
       onclick="location.href='/sales/new'">

    <div class="white-box">

      <img th:src="@{/images/image.jpg}"
           alt="売上情報登録">

      <p>売上情報登録</p>

    </div>

  </div>


  <!-- 売上情報削除 -->
  <div class="grid-card"
       onclick="location.href='/sales/delete-form'">

    <div class="white-box">

      <img th:src="@{/images/image.jpg}"
           alt="売上情報削除">

      <p>売上情報削除</p>

    </div>

  </div>


  <!-- 売上情報修正 -->
  <div class="grid-card"
       onclick="location.href='/sales/search-form'">

    <div class="white-box">

      <img th:src="@{/images/image.jpg}"
           alt="売上情報修正">

      <p>売上情報修正</p>

    </div>

  </div>


  <!-- 売上情報集計 -->
  <div class="grid-card"
       onclick="location.href='/sales/summary'">

    <div class="white-box">

      <img th:src="@{/images/image.jpg}"
           alt="売上情報集計">

      <p>売上情報集計</p>

    </div>

  </div>

</div>

</body>
</html>
