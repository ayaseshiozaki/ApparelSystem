<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>売上情報修正</title>

    <link rel="stylesheet"
          th:href="@{/css/03-17-uriage/10-uriage_syuusei.css}">
</head>

<body>

<div class="container">

    <h1>売上情報修正</h1>

    <!-- 修正内容を11番の確認画面へ送信 -->
    <form th:action="@{/sales/confirm}"
          th:object="${sale}"
          method="post">

        <div class="form-grid">

            <!-- 売上ID：修正不可 -->
            <label for="saleID">売上ID</label>

            <input id="saleID"
                   type="text"
                   th:field="*{saleID}"
                   readonly>


            <!-- 明細ID：修正不可 -->
            <label for="lineID">明細ID</label>

            <input id="lineID"
                   type="text"
                   th:field="*{lineID}"
                   readonly>


            <!-- 受付ID：修正不可 -->
            <label for="acceptanceID">受付ID</label>

            <input id="acceptanceID"
                   type="text"
                   th:field="*{acceptanceID}"
                   readonly>


            <!-- 売上日時 -->
            <label for="saleDateAndTime">売上日時</label>

            <input id="saleDateAndTime"
                   type="datetime-local"
                   th:field="*{saleDateAndTime}"
                   required>


            <!-- 数量 -->
            <label for="quantity">数量</label>

            <input id="quantity"
                   type="number"
                   th:field="*{quantity}"
                   min="1"
                   required>


            <!-- 購入者年代 -->
            <label for="buyersAgeGroup">購入者年代</label>

            <select id="buyersAgeGroup"
                    th:field="*{buyersAgeGroup}">

                <option value="">選択してください</option>
                <option value="1">10代</option>
                <option value="2">20代</option>
                <option value="3">30代</option>
                <option value="4">40代</option>
                <option value="5">50代以上</option>

            </select>


            <!-- 購入者性別 -->
            <label>購入者性別</label>

            <div class="radio-group">

                <label>
                    <input type="radio"
                           th:field="*{buyersGender}"
                           value="1">
                    男性
                </label>

                <label>
                    <input type="radio"
                           th:field="*{buyersGender}"
                           value="2">
                    女性
                </label>

            </div>


            <!-- 担当者 -->
            <label for="contactPerson">担当者</label>

            <input id="contactPerson"
                   type="number"
                   th:field="*{contactPerson}"
                   required>


            <!-- 支払方法 -->
            <label>支払方法</label>

            <div class="radio-group">

                <label>
                    <input type="radio"
                           th:field="*{paymentMethod}"
                           value="1">
                    現金
                </label>

                <label>
                    <input type="radio"
                           th:field="*{paymentMethod}"
                           value="2">
                    カード
                </label>

                <label>
                    <input type="radio"
                           th:field="*{paymentMethod}"
                           value="3">
                    QRコード
                </label>

            </div>

        </div>


        <div class="button-area">

            <button type="submit"
                    class="exec-btn">
                確認
            </button>

            <button type="button"
                    class="back-btn"
                    onclick="location.href='/sales/search-form'">
                戻る
            </button>

        </div>

    </form>

</div>

</body>

</html>
