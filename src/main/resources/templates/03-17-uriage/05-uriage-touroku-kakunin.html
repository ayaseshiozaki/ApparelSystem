<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録確認</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../../static/css/03-17-uriage/05-uriage-touroku-kakunin.css" th:href="@{/css/03-17-uriage/05-uriage-touroku-kakunin.css}">
</head>
<body>

    <div class="container">

        <h1>登録確認</h1>

        <div class="confirm-box">
            <table class="list-table">
                <thead>
                    <tr>
                        <th>売上ID</th>
                        <th>明細ID</th>
                        <th>売上日時</th>
                        <th>数量</th>
                        <th>買った人の<br>年代</th>
                        <th>買った人の<br>性別</th>
                        <th>担当者</th>
                        <th>支払方法</th>
                        <th>商品ID</th>
                        <th>商品名</th>
                        <th>アイテム<br>区分</th>
                        <th>ジェンダー</th>
                        <th>販売対象<br>年齢</th>
                        <th>仕入れ<br>単価</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="14" class="placeholder">登録する売上データを表示</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="question">この内容で登録しますか？</p>

        <div class="button-area">
            <button class="btn-register" onclick="location.href='12-uriage-touroku-kanryou.html'">登録実行</button>
            <button class="btn-back" onclick="location.href='04-uriage-touroku.html'">情報登録へ戻る</button>
        </div>

    </div>

</body>
</html>
