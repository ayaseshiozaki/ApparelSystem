
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>売上情報検索</title>
  <link rel="stylesheet"
        th:href="@{/css/03-17-uriage/07-uriage_sakuzyo.css}">
</head>

<body>
<div class="page-wrapper">
  <h1 class="page-title">売上情報検索</h1>
  <p class="section-label">検索条件</p>

  <form th:action="@{/sales/delete-search}" method="get">

    <div class="form-area">

      <!-- 左カラム -->
      <div class="left-col">

        <div class="form-row">
          <label>売上ID</label>
          <input type="text" name="saleID"
                 placeholder="売上IDを入力">
        </div>

        <div class="form-row">
          <label>明細ID</label>
          <input type="text" name="lineID"
                 placeholder="明細IDを入力">
        </div>

        <div class="form-row">
          <label>販売日</label>
          <input type="date" name="saleDate" class="input-date">
        </div>

        <div class="form-row">
          <label>商品名</label>
          <select>
            <option>アイテムの検索</option>
          </select>
        </div>

        <div class="form-row">
          <label>単価</label>
          <input type="text" placeholder="（例）¥3000">
        </div>

        <div class="form-row">
          <label>担当者名</label>
          <input type="text" value="担当者名表示(修正不可)"
                 readonly class="input-readonly">
        </div>

        <div class="form-row align-top">
          <label>支払方法</label>
          <select name="paymentMethod">
            <option value="">すべて</option>
            <option value="1">現金</option>
            <option value="2">カード</option>
            <option value="3">QRコード</option>
          </select>
        </div>

      </div>

      <!-- 右カラム -->
      <div class="right-col">

        <div class="form-row">
          <label>年代</label>
          <select name="ageGroup" class="select-narrow">
            <option value="">すべて</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>

        <div class="form-row gender-row">
          <label>性別</label>
          <select name="gender">
            <option value="">すべて</option>
            <option value="1">男性</option>
            <option value="2">女性</option>
          </select>
        </div>

        <div class="form-row">
          <label>数量</label>
          <input type="number" name="quantity"
                 placeholder="数量を記載" class="input-short">
        </div>

      </div>
    </div>

    <!-- ボタン -->
    <div class="button-row">
      <button type="submit" class="btn-search">検索</button>
      <button type="button" class="btn-back"
              onclick="location.href='/uriage'">戻る</button>
    </div>

  </form>
</div>
</body>
</html>
