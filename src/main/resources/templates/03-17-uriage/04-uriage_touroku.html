<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>売上情報登録</title>

    <link rel="stylesheet"
          th:href="@{/css/03-17-uriage/04-uriage_touroku.css}">
</head>

<body>

<div class="page-wrapper">

    <h1 class="page-title">
        売上情報登録
    </h1>

    <!-- CSVアップロード -->
    <form class="file-row"
          th:action="@{/sales/upload}"
          method="post"
          enctype="multipart/form-data">

        <label for="csvFile">
            売上データ（CSV）
        </label>

        <input id="csvFile"
               type="file"
               name="csvFile"
               accept=".csv"
               class="btn-file"
               required>

        <button type="submit"
                class="btn-send">
            送信
        </button>

    </form>

    <!-- エラーメッセージ -->
    <p class="error"
       th:if="${errorMessage}"
       th:text="${errorMessage}">
    </p>

    <!-- 一覧表示 -->
    <p class="list-label">
        一覧表示
    </p>

    <div class="list-box">

        <table class="list-table">

            <thead>
            <tr>
                <th>売上ID</th>
                <th>明細ID</th>
                <th>受付ID</th>
                <th>売上日時</th>
                <th>数量</th>
                <th>購入者年代</th>
                <th>購入者性別</th>
                <th>担当者</th>
                <th>支払方法</th>
            </tr>
            </thead>

            <tbody>

            <!-- データがない場合 -->
            <tr th:if="${#lists.isEmpty(sales)}">
                <td colspan="9" class="placeholder">
                    売上データがありません
                </td>
            </tr>

            <!-- DBに登録された売上表示 -->
            <tr th:each="sale : ${sales}">
                <td th:text="${sale.saleID}"></td>
                <td th:text="${sale.lineID}"></td>
                <td th:text="${sale.acceptanceID}"></td>
                <td th:text="${sale.saleDateAndTime}"></td>
                <td th:text="${sale.quantity}"></td>
                <td th:text="${sale.buyersAgeGroup}"></td>
                <td th:text="${sale.buyersGender}"></td>
                <td th:text="${sale.contactPerson}"></td>
                <td th:text="${sale.paymentMethod}"></td>
            </tr>

            </tbody>

        </table>

    </div>

    <div class="register-row">

        <button type="button"
                class="btn-back"
                onclick="location.href='/uriage'">
            戻る
        </button>

    </div>

</div>

</body>
</html>
