
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果一覧</title>

    <link rel="stylesheet"
          th:href="@{/css/03-17-uriage/08-uriage_kensaku_kekka.css}">
</head>

<body>

<div class="container">

    <h1>検索結果一覧</h1>

    <div class="result-box">

        <p>検索結果一覧</p>

        <table border="1">
            <thead>
            <tr>
                <th>売上ID</th>
                <th>明細ID</th>
                <th>販売日時</th>
                <th>数量</th>
                <th>年代</th>
                <th>性別</th>
                <th>支払方法</th>
                <th>操作</th>
            </tr>
            </thead>

            <tbody>

            <!-- 検索結果がある場合 -->
            <tr th:each="sale : ${sales}">

                <td th:text="${sale.saleID}"></td>

                <td th:text="${sale.lineID}"></td>

                <td th:text="${sale.saleDateAndTime}"></td>

                <td th:text="${sale.quantity}"></td>

                <td th:text="${sale.buyersAgeGroup}"></td>

                <td th:text="${sale.buyersGender}"></td>

                <td th:text="${sale.paymentMethod}"></td>

                <td>
                    <form th:action="@{/sales/delete-confirm}"
                          method="get">

                        <input type="hidden"
                               name="saleID"
                               th:value="${sale.saleID}">

                        <button type="submit" class="btn-delete">
                            削除
                        </button>

                    </form>
                </td>

            </tr>

            <!-- 検索結果が0件の場合 -->
            <tr th:if="${#lists.isEmpty(sales)}">
                <td colspan="8">
                    該当する売上情報はありません。
                </td>
            </tr>

            </tbody>
        </table>

    </div>

    <div class="button-area">

        <button type="button" class="btn-back"
                onclick="location.href='/sales/delete-form'">
            戻る
        </button>

    </div>

</div>

</body>
</html>
