<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品一覧</title>
</head>
<body>

<h1>商品一覧</h1>

<table border="1">
    <tr>
        <th>商品ID</th>
        <th>仕入れ先ID</th>
        <th>商品登録日</th>
        <th>商品名</th>
        <th>アイテム区分</th>
        <th>カラー</th>
        <th>サイズ</th>
        <th>ジェンダー</th>
        <th>販売対象年齢</th>
        <th>仕入れ単価</th>
    </tr>

    <tr th:each="product : ${products}">

        <td th:text="${product.productID}"></td>
        <td th:text="${product.supplierID}"></td>
        <td th:text="${product.productRegistrationDate}"></td>
        <td th:text="${product.productName}"></td>
        <td th:text="${product.itemCategory}"></td>
        <td th:text="${product.color}"></td>
        <td th:text="${product.size}"></td>
        <td th:text="${product.gender}"></td>
        <td th:text="${product.targetSalesAgeGroup}"></td>
        <td th:text="${product.purchasePrice}"></td>

    </tr>

</table>

</body>
</html>
