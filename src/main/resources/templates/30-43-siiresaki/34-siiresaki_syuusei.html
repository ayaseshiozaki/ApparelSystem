<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>仕入先情報検索</title>
    <link rel="stylesheet" th:href="@{/css/30-43-siiresaki/34-siiresaki_syuusei.css}">
</head>
<body>

<div class="container">
    <h1>仕入先情報検索</h1>

    <!-- GETメソッドで /supplier/search/result へ送信 -->
    <form class="search-area" th:action="@{/supplier/search/result}" method="get">
        <h2 class="section-title">検索条件</h2>

        <label>仕入れID</label>
        <input type="text" name="supplierID" placeholder="仕入れIDを入力">

        <label>仕入れ先名</label>
        <input type="text" name="supplierName" placeholder="仕入れ先名を入力">

        <label>仕入れ住所</label>
        <input type="text" name="supplierAddress" placeholder="仕入れ住所を入力">

        <label>電話番号</label>
        <input type="text" name="phoneNumber" placeholder="電話番号を入力">

        <label>担当者名</label>
        <input type="text" name="contactPersonName" placeholder="担当者名を入力">

        <label>メールアドレス</label>
        <input type="email" name="mailAddress" placeholder="メールアドレスを入力">

        <div class="button-area">
            <button type="submit" class="search-btn">検索</button>
            <button type="button" class="back-btn" th:onclick="|location.href='@{/supplier/menu}'|">戻る</button>
        </div>
    </form>
</div>

</body>
</html>
