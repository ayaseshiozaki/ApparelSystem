<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>仕入先情報削除実行</title>
    <!-- 41番のCSSをキャッシュバスター付きで読み込む -->
    <link rel="stylesheet" th:href="@{/css/30-43-siiresaki/41-siiresaki_sakuzyo_zikkou.css(v=2)}">
</head>
<body>

<div class="container">
    <h1>仕入先情報 削除確認</h1>

    <form th:action="@{/supplier/delete/execute}" method="post">
        <!-- 削除対象の主キーをhiddenで送信 -->
        <input type="hidden" name="supplierID" th:value="${supplier.supplierID}">

        <!-- CSSの .delete-area に合わせる -->
        <div class="delete-area">
            <label>仕入れID</label>
            <p class="value" th:text="${supplier.supplierID}"></p>

            <label>仕入れ先名</label>
            <p class="value" th:text="${supplier.supplierName}"></p>

            <label>仕入れ先住所</label>
            <p class="value" th:text="${supplier.supplierAddress}"></p>

            <label>電話番号</label>
            <p class="value" th:text="${supplier.phoneNumber}"></p>

            <label>担当者名</label>
            <p class="value" th:text="${supplier.contactPersonName}"></p>

            <label>メールアドレス</label>
            <p class="value" th:text="${supplier.mailAddress}"></p>

            <!-- CSSの .confirm-text に合わせる -->
            <p class="confirm-text">この仕入先情報を削除します。よろしいですか？</p>

            <div class="button-area">
                <!-- CSSの .delete-btn と .cancel-btn に合わせる -->
                <button type="submit" class="delete-btn">削除実行</button>
                <button type="button" class="cancel-btn" onclick="history.back()">戻る</button>
            </div>
        </div>
    </form>
</div>

</body>
</html>
