<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>商品登録</title>
    <link rel="stylesheet" href="../static/css/44-shouhintouroku.css">
</head>
<body>

<div class="container">

    <h1>商品登録</h1>

    <form class="product-form">

        <label>商品コード</label>
        <input type="text" name="code" placeholder="例：A001">

        <label>仕入れ先コード</label>
        <input type="text" name="code" placeholder="例：A001">

        <label>商品名</label>
        <input type="text" name="name" placeholder="例：Tシャツ（白）">

        <label>アイテム区分</label>
        <input type="text" name="category"
               placeholder="10:アウター,20:トップス,30:ワンピース,40:ボトムス,50:バッグ,50:ファッション小物,70:その他">

        <label>カラー</label>
        <input type="text" name="category" placeholder="例：ホワイト">

        <label>サイズ</label>
        <input type="text" name="category" placeholder="例：100,120,SS,S,M,L,XL,2XLなど">

        <label>ジェンダー</label>
        <input type="text" name="category" placeholder="例：M,F,Uなど">

        <label>販売対象年齢</label>
        <input type="text" name="category"
               placeholder="00：KIDS,10:10代,1A:10～20代,20:20代,2A:20～30代,30:30代,3A:30～40代,40:40代,4A:40～50代,50:50代,AA:それ以上,FF:指定なし">

        <label>仕入れ単価</label>
        <input type="number" name="price" placeholder="例：1980">

        <label>初期在庫数</label>
        <input type="number" name="stock" placeholder="例：50">

        <div class="button-area">
            <button class="register-btn" onclick="location.href='18-29-zaiko/19-zaikoitiranhyouzi.html'">登録する</button>
            <button class="back-btn" onclick="location.href='18-29-zaiko/18-zaikokannri.html'">戻る</button>
        </div>

    </form>

</div>

</body>
</html>
