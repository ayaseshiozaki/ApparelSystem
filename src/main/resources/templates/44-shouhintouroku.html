<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>商品登録</title>
    <link rel="stylesheet" href="../static/css/44-shouhintouroku.css">
</head>
<body>

<div class="container">

    <h1>商品登録</h1>

    <form class="product-form">

        <label>商品コード</label>
        <input type="text" name="code" placeholder="例：A001">

        <label>商品名</label>
        <input type="text" name="name" placeholder="例：Tシャツ（白）">

        <label>カテゴリ</label>
        <input type="text" name="category" placeholder="例：トップス">

        <label>単価</label>
        <input type="number" name="price" placeholder="例：1980">

        <label>初期在庫数</label>
        <input type="number" name="stock" placeholder="例：50">

        <div class="button-area">
            <button class="register-btn" onclick="location.href='18-29-zaiko/19-zaikoitiranhyouzi.html'">登録する</button>
            <button class="back-btn" onclick="location.href='18-29-zaiko/18-zaikokannri.html'">戻る</button>
        </div>

    </form>

</div>

</body>
</html>
