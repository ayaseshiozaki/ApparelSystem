<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>在庫詳細表示</title>
    <link rel="stylesheet" href="../../static/css/18-29-zaiko/20-zaikosyousaihyouzi.css">
</head>
<body>

<div class="container">

    <h1>在庫詳細表示</h1>

    <form>
        <div class="form-grid">

            <label>商品コード</label>
            <input type="text" placeholder="コード表示" disabled>

            <label>商品名</label>
            <input type="text" placeholder="商品名表示" disabled>

            <label>カテゴリ</label>
            <select>
                <option>アイテムの検索</option>
            </select>

            <label>在庫数</label>
            <input type="text" placeholder="在庫数表示" disabled>

            <label>単価</label>
            <input type="text" placeholder="単価表示" disabled>

            <label>仕入れ先</label>
            <input type="text" placeholder="仕入れ先表示" disabled>

            <label>入荷日</label>
            <input type="date" value="2026-05-29">

            <label>備考</label>
            <input type="text" placeholder="備考欄">

            <label>受入ID</label>
            <input type="text" placeholder="ID表示" disabled>

        </div>

        <div class="button-area">
            <button class="edit-btn" onclick="location.href='21-zaikosyousaisyuusei.html'">修正</button>
            <button class="back-btn" onclick="location.href='19-zaikoitiranhyouzi.html'">戻る</button>
        </div>

    </form>

</div>

</body>
</html>
