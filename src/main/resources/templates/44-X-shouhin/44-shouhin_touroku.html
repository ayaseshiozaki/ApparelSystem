<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品登録</title>
    <link rel="stylesheet" th:href="@{/css/44-X-shouhin/44-shouhin_touroku.css(v=2)}">
    <style>
        select{
            width:100%;
            height:45px;
            padding:10px;
            border:2px solid #F2C8DA;
            border-radius:8px;
            background:white;
            font-size:16px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>商品登録</h1>

    <form class="product-form" th:action="@{/product/confirm}" th:object="${product}" method="post">

        <label>商品ID</label>
        <input type="text" th:field="*{productID}" placeholder="例：P0000004" maxlength="8" required>

        <label>仕入れ先ID</label>
        <select th:field="*{supplierID}" required>
            <option value="">-- 仕入れ先を選択してください --</option>
            <option th:each="s : ${suppliers}"
                    th:value="${s.supplierID}"
                    th:text="${s.supplierID + ' : ' + s.supplierName}">
            </option>
        </select>

        <label>商品登録日</label>
        <input type="date" th:field="*{productRegistrationDate}" required>

        <label>商品名</label>
        <input type="text" th:field="*{productName}" placeholder="例：Tシャツ（白）" maxlength="32" required>

        <label>アイテム区分</label>
        <input type="text" th:field="*{itemCategory}" maxlength="2"
               placeholder="10:アウター,20:トップス,30:ワンピース,40:ボトムス,50:バッグ,60:ファッション小物,70:その他">

        <label>カラー</label>
        <input type="text" th:field="*{color}" placeholder="例：ホワイト" maxlength="16">

        <label>サイズ</label>
        <input type="text" th:field="*{size}" placeholder="例：100,120,SS,S,M,L,XL,2XLなど" maxlength="4">

        <label>ジェンダー</label>
        <input type="text" th:field="*{gender}" placeholder="例：M,F,Uなど" maxlength="1">

        <label>販売対象年齢</label>
        <input type="text" th:field="*{targetSalesAgeGroup}" maxlength="2"
               placeholder="00：KIDS,10:10代,1A:10～20代,20:20代,2A:20～30代,30:30代,3A:30～40代,40:40代,4A:40～50代,50:50代,AA:それ以上,FF:指定なし">

        <label>仕入れ単価</label>
        <input type="number" th:field="*{purchasePrice}" placeholder="例：1980">

        <div class="button-area">
            <button type="submit" class="register-btn">確認へ進む</button>
            <button type="button" class="back-btn" th:onclick="|location.href='@{/products}'|">商品一覧へ</button>
        </div>
    </form>

</div>

</body>
</html>
