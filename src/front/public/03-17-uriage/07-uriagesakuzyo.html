<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>売上情報検索</title>
<link rel="stylesheet" href="../../css/03-17-uriage/07-uriagesakuzyo.css">
</head>
<body>
  <div class="page-wrapper">
    <h1 class="page-title">売上情報検索</h1>
 
    <p class="section-label">検索条件</p>
 
    <div class="form-area">
 
      <!-- 左カラム -->
      <div class="left-col">
        <div class="form-row">
          <label>売上ID</label>
          <input type="text" value="ID表示(修正不可)" readonly class="input-readonly">
        </div>
        <div class="form-row">
          <label>明細ID</label>
          <input type="text" placeholder="テキスト入力">
        </div>
        <div class="form-row">
          <label>販売日</label>
          <input type="date" value="2026-05-29" class="input-date">
        </div>
        <div class="form-row">
          <label>商品名</label>
          <select>
            <option>アイテムの検索</option>
          </select>
        </div>
        <div class="form-row">
          <label>単価</label>
          <input type="text" placeholder="（例）¥3000">
        </div>
        <div class="form-row">
          <label>担当者名</label>
          <input type="text" value="担当者名表示(修正不可)" readonly class="input-readonly">
        </div>
        <div class="form-row align-top">
          <label>支払方法</label>
          <div class="checkbox-group">
            <label class="check-label"><input type="checkbox"> 現金</label>
            <label class="check-label"><input type="checkbox"> カード</label>
            <label class="check-label"><input type="checkbox"> QRコード</label>
          </div>
        </div>
      </div>
 
      <!-- 右カラム -->
      <div class="right-col">
        <div class="form-row">
          <label>年代</label>
          <select class="select-narrow">
            <option>1</option>
            <option>2</option>
            <option>3</option>
          </select>
        </div>
        <div class="form-row gender-row">
          <div class="checkbox-group">
            <label class="check-label"><input type="checkbox"> 男性</label>
            <label class="check-label"><input type="checkbox"> 女性</label>
          </div>
        </div>
        <div class="form-row">
          <label>数量</label>
          <input type="text" placeholder="数量を記載" class="input-short">
        </div>
      </div>
 
    </div>
 
    <!-- ボタン -->
    <div class="button-row">
      <button class="btn-search">検索</button>
      <button class="btn-back">戻る</button>
    </div>
  </div>
</body>
</html>
