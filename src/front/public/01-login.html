<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
<link rel="stylesheet" href="../css/01-login.css">
</head>
<body>
  <div class="login-container">
    <img src="../images/Copilot_20261016_115641.png" alt="ロゴ" class="logo-icon">
 
    <div class="form-row">
      <label for="email">メールアドレス</label>
      <input type="text" id="email" placeholder="テキスト入力">
    </div>
 
    <div class="form-row">
      <label for="password">パスワード</label>
      <input type="password" id="password" placeholder="テキスト入力">
    </div>
 
    <div class="button-row">
      <button class="btn-login" onclick="location.href='02-index.html'">ログイン</button>
      <button class="btn-register" onclick="location.href='02-index.html'">新規登録</button>
    </div>
  </div>
</body>
</html>
