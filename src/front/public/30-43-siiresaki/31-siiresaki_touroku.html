<!DOCTYPE html>
<html lang="ja">

    <title>仕入れ情報入力</title>
    <link rel="stylesheet" href="../../css/30-43-siiresaki/31-siiresakitouroku.css">
</head>
<body>

<div class="container">

    <h1>仕入れ情報入力</h1>

    <form class="form-area">

        <label>仕入れID</label>
        <input type="text" placeholder="仕入れIDを入力">

        <label>仕入れ名前</label>
        <input type="text" placeholder="仕入れ名前を入力">

        <label>仕入れ住所</label>
        <input type="text" placeholder="仕入れ住所を入力">

        <label>電話番号</label>
        <input type="text" placeholder="電話番号を入力">

        <div class="button-area">
            <button class="register-btn" onclick="location.href='32-siiresakitourokukakunin.html'">登録</button>

    </form>
