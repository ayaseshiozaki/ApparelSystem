<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>在庫詳細修正</title>

</head>
<body>

<div class="container">

    <h1>在庫詳細修正</h1>

    <form>
        <div class="form-grid">

            <label>商品コード</label>

            <label>カテゴリ</label>
            <select>
                <option>アイテムの検索</option>
            </select>

            <label>在庫数</label>

            <label>単価</label>

            <label>仕入れ先</label>
            <input type="text" placeholder="仕入れ先表示">

            <label>入荷日</label>
            <input type="date" value="2026-05-29">

            <label>備考</label>
            <input type="text" placeholder="備考欄">

            <label>受入ID</label>
            <input type="text" placeholder="ID表示" disabled>

        </div>

        <div class="button-area">
            <button class="confirm-btn" onclick="location.href='23-zaikosyuuseikakunin.html'">確認</button>
            <button class="back-btn" onclick="location.href='20-zaikosyousaihyouzi.html'">戻る</button>

</div>
